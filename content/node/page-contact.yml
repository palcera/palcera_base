      value: "<p>We would love to hear from you. Whether you need help with tax planning, have questions about our bookkeeping services, or want to schedule a free consultation, our team is here to help.</p><h2>Get in touch</h2><p>Email us at <a href='mailto:info@mitchellassociates.example.com'>info@mitchellassociates.example.com</a> or give us a call at +1-555-0100. Our team typically responds within one business day.</p><h2>Office hours</h2><p>Monday through Friday, 8:30 AM to 5:30 PM (EST). Extended hours available during tax season (January through April). We are happy to schedule evening or weekend appointments when needed.</p><h2>Location</h2><p>Mitchell &amp; Associates<br>742 Commerce Drive, Suite 300<br>Oakville, ON L6H 3T7<br>Canada</p>"
