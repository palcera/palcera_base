  schema_abstract:
    -
      value: 'Structured data helps search engines understand your content, leading to rich results and better visibility in search.'
  schema_article_body:
    -
      value: "<p>Structured data is a standardized format for providing information about a page and classifying its content. When you add structured data to your website, search engines can better understand what your pages are about, which can lead to enhanced search results known as rich results.</p><h2>What is Schema.org?</h2><p>Schema.org is a collaborative vocabulary that webmasters can use to structure data on their pages. Founded by Google, Microsoft, Yahoo, and Yandex, it provides a shared set of schemas that describe things on the web. From articles and people to events and products, Schema.org covers a wide range of content types.</p><h2>Benefits for your site</h2><p>Implementing structured data brings several advantages. Search engines display rich snippets that stand out in results, increasing click-through rates. Your content becomes eligible for knowledge panels, carousels, and other enhanced features. Additionally, structured data makes your content more accessible to AI assistants and voice search platforms.</p><p>Perhaps most importantly, structured data creates a foundation for the future. As AI-powered search evolves, websites with well-structured content will be better positioned to surface in AI-generated answers and recommendations.</p><h2>Getting started</h2><p>The easiest way to implement structured data is through tools that handle it automatically. Content management systems like Drupal can generate JSON-LD markup based on your content, eliminating the need for manual coding. This approach ensures your structured data stays in sync with your content as it changes.</p>"
      format: full_html
