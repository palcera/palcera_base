name: Palcera Base
type: Site
description: 'Palcera CMS base template with Schema.org content modeling, AI-ready content, and enhanced security.'
recipes:
  - core/recipes/administrator_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_performance
  - drupal_cms_admin_ui
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_content_type_base
  - drupal_cms_forms
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_search
  - drupal_cms_seo_basic
  - drupal_cms_accessibility_tools
  - drupal_cms_seo_tools
  - drupal_cms_google_analytics
  - project_browser
  - selective_better_exposed_filters
  - ui_icons_menu
  - easy_email_express
install:
  - mercury
  - cva
  - seckit
  - antibot
  - config_split
  - fast404
  - http_cache_control
config:
  actions:
    system.theme:
      simpleConfigUpdate:
        default: mercury
extra:
  recipe_installer_kit:
    finish_url: '/admin/dashboard/welcome'
