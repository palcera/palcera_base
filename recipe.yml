name: Palcera Base
type: Site
description: 'Palcera CMS base template with Schema.org content modeling, AI-ready content, and enhanced security.'
recipes:
  - core/recipes/administrator_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_performance
  - drupal_cms_admin_ui
  - drupal_cms_content_type_base
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_media
  - core/recipes/audio_media_type
  - core/recipes/local_video_media_type
  - drupal_cms_privacy_basic
  - drupal_cms_search
  - drupal_cms_seo_basic
  - drupal_cms_accessibility_tools
  - drupal_cms_seo_tools
  - drupal_cms_google_analytics
  - easy_email_express
install:
  # Schema.org content modeling
  - schemadotorg
  - schemadotorg_node
  - schemadotorg_jsonld
  - schemadotorg_media
  - schemadotorg_taxonomy
  - schemadotorg_metatag
  - schemadotorg_pathauto
  - schemadotorg_additional_mappings
  # Theme and UI
  - palcera_theme
  - cva
  - responsive_image
  - ui_icons_menu
  # Security
  - seckit
  - antibot
  # Performance
  - fast404
  - http_cache_control
  # Development tools
  - config_split
  - project_browser
  - selective_better_exposed_filters
config:
  strict: false
  import:
    system:
      - system.menu.footer
      - system.menu.main
    schemadotorg: '*'
    schemadotorg_node: '*'
    schemadotorg_media: '*'
    schemadotorg_taxonomy: '*'
  actions:
    core.extension:
      executeInstallHook:
        - schemadotorg
        - schemadotorg_node
        - schemadotorg_media
        - schemadotorg_taxonomy
    # Allow Canvas to render all content types.
    field.storage.node.field_component_tree:
      addToAllBundles:
        label: Components
        description: Stores a component tree for Canvas.
    # Only show basic metatag fields on Canvas pages.
    metatag.settings:
      simpleConfigUpdate:
        entity_type_groups:
          canvas_page:
            canvas_page:
              basic: basic
    system.theme:
      simpleConfigUpdate:
        default: palcera_theme
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
extra:
  recipe_installer_kit:
    finish_url: '/admin/dashboard/welcome'
